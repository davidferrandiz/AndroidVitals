name: CI

on:
  push:
    branches-ignore:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      # Si cambia el esquema de Room y no se ha hecho commit de core/schemas, se ve aquí.
      - name: Room schema up to date
        run: |
          git status --porcelain core/schemas
          # Imprime el esquema nuevo para poder copiarlo desde el log si hace falta.
          git ls-files --others --modified core/schemas | while read -r f; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          test -z "$(git status --porcelain core/schemas)" || echo "::warning::core/schemas cambió: haz commit del esquema exportado"

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: core/schemas
          if-no-files-found: ignore
