name: AI Code Review (LLM local)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    # ⚠️ self-hosted: un runner en TU máquina (con Ollama + Python + gh).
    # Los runners en la nube de GitHub NO llegan a tu Ollama local (localhost:11434).
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar entorno Python (venv propio del runner)
        # venv en el runner: evita el "externally-managed-environment" de Homebrew en macOS.
        run: |
          python3 -m venv "$HOME/pr-bot-venv"
          "$HOME/pr-bot-venv/bin/pip" install -q --upgrade pip openai

      - name: Sacar el diff del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr.diff

      - name: Revisar con el LLM local (JSON estructurado)
        env:
          PR_BOT_MODEL: qwen3-coder:latest
        run: |
          "$HOME/pr-bot-venv/bin/python" .github/scripts/ci_review.py pr.diff > review.json

      - name: Publicar review inline (línea a línea)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_ID: ${{ github.event.pull_request.head.sha }}
          PR_BOT_MIN_SEVERITY: media      # umbral: alta + media
          PR_BOT_REVIEW_EVENT: COMMENT     # no bloquea el merge
          PR_BOT_SUMMARY: "1"              # resumen de cabecera + inline
        run: |
          "$HOME/pr-bot-venv/bin/python" .github/scripts/post_review.py review.json pr.diff
